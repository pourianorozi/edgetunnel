	<title>KV متصل نیست — پنل مدیریت edgetunnel</title>
	<style>
		body { font-family: Tahoma, 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; direction: rtl; }
		.card { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 40px; max-width: 560px; text-align: center; }
		h1 { color: #fbbf24; font-size: 22px; margin: 0 0 14px; }
		p { line-height: 2; margin: 10px 0; font-size: 15px; }

<body>
	<div class="card">
		<h1>⚠️ فضای نام KV متصل نشده است</h1>
		<p>این پروژه برای ذخیرهٔ تنظیمات به Cloudflare KV نیاز دارد. در داشبورد Cloudflare یک فضای نام KV بسازید و آن را با نام <code>KV</code> به پروژه متصل کنید، سپس دوباره استقرار دهید.</p>
		<p>اگر متغیر <code>UUID</code> را تعیین کرده باشید، بدون KV فقط اتصال‌های مستقیم (بدون پنل) کار می‌کنند.</p>
	</div>
